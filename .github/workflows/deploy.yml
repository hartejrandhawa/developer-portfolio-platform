name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/DevPortfolio/DevPortfolio.csproj
      - name: Build
        run: dotnet build backend/DevPortfolio/DevPortfolio.csproj --no-restore --configuration Release
      - name: Publish
        run: dotnet publish backend/DevPortfolio/DevPortfolio.csproj --no-build --configuration Release -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: backend-publish
          path: publish

  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    needs: [build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-publish
          path: publish

      - name: Deploy to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "publish/*"
          target: "/home/${{ secrets.EC2_USER }}/releases/${{ github.sha }}"

      - name: Switch to new release and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Symlink swap keeps the previous release running until the very
            # moment the new one is ready, minimizing the restart window —
            # true zero-downtime would need a load balancer across 2+
            # instances, which is a reasonable next step but out of scope
            # for a single EC2 instance.
            ln -sfn /home/${{ secrets.EC2_USER }}/releases/${{ github.sha }} /home/${{ secrets.EC2_USER }}/current
            sudo systemctl restart devportfolio.service
