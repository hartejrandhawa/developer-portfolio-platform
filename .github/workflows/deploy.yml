name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Publish backend
        run: dotnet publish backend/DevPortfolio/DevPortfolio.csproj --configuration Release -o publish

      # The API serves the SPA from wwwroot (UseStaticFiles + fallback to
      # index.html), so one process and one origin serve both: no CORS in prod.
      - name: Bundle frontend into the backend
        run: |
          mkdir -p publish/wwwroot
          cp -r frontend/dist/. publish/wwwroot/

      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: publish

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
          path: publish

      - name: Copy release to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "publish/*"
          target: "/home/${{ secrets.EC2_USER }}/releases/${{ github.sha }}"

      - name: Switch to new release and restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Symlink swap keeps the previous release running until the very
            # moment the new one is ready, minimizing the restart window —
            # true zero-downtime would need a load balancer across 2+
            # instances, which is a reasonable next step but out of scope
            # for a single EC2 instance.
            ln -sfn /home/${{ secrets.EC2_USER }}/releases/${{ github.sha }} /home/${{ secrets.EC2_USER }}/current
            sudo systemctl restart devportfolio.service
