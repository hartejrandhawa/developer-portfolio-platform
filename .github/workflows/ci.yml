name: CI

# Runs on every pull request, and is called by deploy.yml as a gate before
# anything ships (so pushes to main don't run the suite twice).
on:
  pull_request:
  workflow_call:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/DevPortfolio.sln
      - name: Build
        run: dotnet build backend/DevPortfolio.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test backend/DevPortfolio.sln --no-build --configuration Release --verbosity normal

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
